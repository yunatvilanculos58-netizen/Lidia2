<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | CasaFacil</title>

    <link rel="stylesheet" href="contato.css">

</head>

<body>

    <!-- MENU -->

    
    <header class="banner">

        <nav>

            <div class="logo">
                Casa<span>Facil</span>
            </div>

            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#casas">Casas</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>

        </nav>

        <div class="banner-conteudo">

            <h1>Contacte-nos</h1>

        </div>

    </header>


    <!-- CONTACTO -->

    <section class="contacto">

        <h1>Entre em contacto</h1>

        <p>
            Tem alguma dúvida? Estamos aqui para ajudar.
        </p>


        <div class="contacto-container">

            <!-- FORMULÁRIO -->

            <div class="formulario">

                <h2>Envie uma mensagem</h2>

                <form id="formContato">

    <label>Nome</label>
    <input
        type="text"
        id="nome"
        placeholder="Seu nome"
        required
    >

    <label>Email</label>
    <input
        type="email"
        id="email"
        placeholder="Seu email"
        required
    >

    <label>Mensagem</label>
    <textarea
        id="mensagem"
        rows="6"
        placeholder="Escreva a sua mensagem"
        required
    ></textarea>

    <button type="submit">
        Enviar mensagem
    </button>

</form>
            </div>


            <!-- INFORMAÇÕES -->

            <div class="dados-contacto">

                <h2>Fale connosco</h2>

                <p>
                    📞 <strong>Telefone</strong><br>
                    +258 84 123 4567
                </p>

                <p>
                    ✉️ <strong>Email</strong><br>
                    geral@casafacil.co.mz
                </p>

                <p>
                    📍 <strong>Localização</strong><br>
                    Maputo, Moçambique
                </p>

            </div>

        </div>

    </section>


    <!-- RODAPÉ -->

    <footer>

        <p>
            © 2026 CasaFacil. Todos os direitos reservados.
        </p>

    </footer>

    <script src="contato.js"></script>

</body>
</html>
